[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scele-cli"
version = "0.1.0"
description = "Command-line client for SCELE (Moodle) at Fasilkom UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["scele", "moodle", "cli", "fasilkom", "ui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scele = "scele.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scele"]
