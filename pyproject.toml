[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scele-cli"
dynamic = ["version"]
description = "Command-line client for SCELE (Moodle) at Fasilkom UI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
keywords = ["scele", "moodle", "cli", "fasilkom", "ui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/Andrew4Coding/scele-cli"
Issues = "https://github.com/Andrew4Coding/scele-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]
yaml = ["pyyaml>=6.0"]
tui = ["textual>=1.0"]

[project.scripts]
scele = "scele.cli:main"

[tool.hatch.version]
path = "src/scele/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scele"]
